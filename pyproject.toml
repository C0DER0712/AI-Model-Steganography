[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-model-steganography-research"
version = "0.1.0"
description = "Defensive AI security research scaffold for model steganography detector evaluation."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Research Team" }
]
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "numpy>=1.26",
    "opencv-python>=4.8",
    "tensorboard>=2.15",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "scipy>=1.12",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
stego-train    = "scripts.train:main"
stego-evaluate = "scripts.evaluate:main"

[tool.setuptools]
packages = ["models", "training", "evaluation", "utils", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
